<!doctype html><html lang="pt-br"><meta charset="utf-8"><title>LitDex — Grafo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/base.css">
<style>
 body{overflow:hidden}
 .tela{display:grid;grid-template-columns:270px 1fr;height:calc(100vh - 3.4rem)}
 #controles{padding:.9rem 1rem;overflow:auto;background:var(--paper);border-right:1px solid var(--rule);font-size:.85rem}
 #controles h4{margin:1rem 0 .3rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500}
 #controles label{display:block;cursor:pointer;margin:.12rem 0}#controles label.off{opacity:.45}
 #palco{position:relative;background:radial-gradient(#f1ebdd 1px,transparent 1px) 0 0/22px 22px}
 svg{width:100%;height:100%;display:block}
 #info{position:absolute;right:.8rem;top:.8rem;width:310px;max-height:calc(100% - 1.6rem);overflow:auto;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:.8rem 1rem;box-shadow:0 6px 24px #0002;font-size:.85rem;display:none}
 #info h3{margin:.1rem 0 .4rem;font-size:1rem}#info .x{float:right}
 #resumo{position:absolute;left:.8rem;bottom:.6rem;font-size:.8rem;color:var(--muted);background:#faf8f3cc;padding:.1rem .5rem;border-radius:6px}
 #vazio{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:2rem;font-style:italic}
 .no text{font:11px system-ui;fill:#2b2620;pointer-events:none;paint-order:stroke;stroke:#faf8f3;stroke-width:3px}
 .aresta{cursor:pointer;transition:opacity .18s}.no{cursor:pointer;transition:opacity .18s}.no:hover text{font-weight:700;font-size:12.5px}.no.selecionado path{stroke:#d56b26;stroke-width:4}
 #barra{position:absolute;left:.8rem;top:.8rem;display:flex;gap:.4rem;z-index:3}#barra button{background:#fffdf8e8}
 @keyframes aneis{0%{r:8;opacity:.9}100%{r:34;opacity:0}}.achado{fill:none;stroke:#c9743a;stroke-width:3;animation:aneis 1.1s ease-out 2}
 .teoria{font-size:.76rem}
 .legenda-familias{display:grid;grid-template-columns:1fr;gap:.15rem;margin:.35rem 0}.legenda-familia{display:flex;gap:.35rem;align-items:center;font-size:.76rem}
 .eixo-temporal text{font:10px system-ui;fill:#70685d}.editor-grafo{border-top:1px dotted var(--rule);padding-top:.35rem;margin-top:.35rem}.editor-grafo summary{cursor:pointer;color:var(--muted);font-size:.8rem}.editor-grafo textarea,.editor-grafo input{margin:.2rem 0}
 input[type=range]{width:100%}
 .med{padding:.25rem 0;border-bottom:1px dotted var(--rule)}
</style>
<header id="nav"></header>
<div class="tela"><aside id="controles"></aside>
 <div id="palco"><svg id="svg"></svg><div id="barra"></div><div id="vazio"></div><div id="info"></div><div id="resumo"></div></div></div>
<script src="/vendor/d3.min.js"></script><script src="/static/base.js"></script><script src="/static/js/grafo.js"></script></html>
