<!doctype html><html lang="pt-br"><meta charset="utf-8"><title>LitDex — Biblioteca</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/base.css">
<style>
 main{max-width:1320px;margin:1.4rem auto 3rem;padding:0 1.4rem}
 h1{font-size:2.1rem;margin:.3rem 0 .4rem}.lead{color:#6b6153;max-width:40rem;margin:0 0 1rem}
 .filtros{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1.1rem}.filtros input{min-width:16rem}
 .grade{display:grid;grid-template-columns:290px minmax(0,1fr);gap:1.2rem;align-items:start}@media(max-width:900px){.grade{grid-template-columns:1fr}}
 .estante{position:sticky;top:4.2rem;border-radius:18px;padding:.8rem .8rem 1.1rem;background:linear-gradient(180deg,#ecdcbd,#dcc59b);border:1px solid #c7a96c;box-shadow:0 14px 0 -6px #a98b52,var(--sombra)}
 .autor{display:flex;gap:.7rem;align-items:center;background:linear-gradient(135deg,#fffaf0,#f7ecd7);border-radius:12px;padding:.55rem .7rem;margin:.45rem 0;cursor:pointer;transition:transform .15s,box-shadow .15s;border:2px solid transparent}
 .autor:hover{transform:translateX(4px);box-shadow:0 4px 12px #5a431b30}.autor.on{border-color:var(--accent)}
 .avatar{width:42px;height:56px;border-radius:5px;background:linear-gradient(160deg,var(--c1,#8b3a1f),var(--c2,#c9743a));color:#fff;display:grid;place-items:center;font:600 1.1rem Georgia,serif;flex:none;overflow:hidden;box-shadow:inset -3px 0 0 #0002}
 .avatar img{width:100%;height:100%;object-fit:cover}.autor small{display:block;color:var(--muted);font:.76rem system-ui}.autor div:nth-child(2){flex:1;min-width:0}
 .prateleira{margin-bottom:1.6rem;min-width:0}.prateleira>h2{position:sticky;left:0}.prateleira>h2{font-size:1.05rem;margin:0 0 .6rem;display:flex;gap:.6rem;align-items:baseline}.prateleira>h2 small{font:.78rem system-ui;color:var(--muted)}
 .parede{display:flex;flex-wrap:nowrap;gap:1.1rem;overflow-x:auto;overflow-y:hidden;align-items:stretch;padding:.25rem .6rem 1rem .35rem;scroll-snap-type:x proximity;scrollbar-width:thin}
 .parede>.livro{flex:0 0 205px;width:205px;scroll-snap-align:start}
 .parede::-webkit-scrollbar{height:8px}.parede::-webkit-scrollbar-thumb{background:#c9b98a;border-radius:8px}
 .livro{background:var(--paper);border:1px solid var(--rule);border-radius:6px 14px 14px 6px;overflow:hidden;box-shadow:-5px 0 0 var(--lombada,#8b3a1f),var(--sombra);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;animation:subir .5s both}
 .livro:hover{transform:translateY(-6px) rotate(-.4deg)}
 .capa{aspect-ratio:5/7;position:relative;display:grid;place-items:center;text-align:center;padding:1rem;color:#fff;background:linear-gradient(160deg,var(--c1,#8b3a1f),var(--c2,#c9743a));overflow:hidden}
 .capa img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;background:#fff}.capa .t{font:600 1.15rem/1.2 Georgia,serif;text-shadow:0 1px 3px #0005}.capa .a{font:.75rem system-ui;opacity:.85;margin-top:.5rem;letter-spacing:.06em;text-transform:uppercase}
 .capa .anel{position:absolute;right:.5rem;top:.5rem;background:#fffdf8e6;border-radius:50%}
 .corpo{padding:.7rem .85rem .9rem;display:flex;flex-direction:column;gap:.35rem;flex:1}
 .corpo h3{font-size:1rem;line-height:1.25}.corpo h3 a{color:var(--ink);text-decoration:none}.corpo h3 a:hover{color:var(--accent)}
 .meta{font:.78rem system-ui;color:var(--muted)}.badges{display:flex;gap:.25rem;flex-wrap:wrap}.badge{font:.7rem system-ui;background:#f1e8d6;border-radius:20px;padding:.05rem .55rem;color:#6b5a3a}
 .ed{font:.76rem system-ui;color:#5b5143;border-top:1px dashed var(--rule);padding-top:.35rem}.ed a{font-weight:600}
 .acoes{display:flex;gap:.4rem;margin-top:auto;padding-top:.4rem}.acoes a{flex:1;text-align:center;text-decoration:none}.acoes button{width:100%}
 .vazio{padding:3rem;text-align:center;color:var(--muted);font-style:italic}
</style>
<header id="nav"></header>
<main>
 <div class="kicker">Arquivo</div><h1>Biblioteca</h1>
 <p class="lead">Estantes organizadas por autor. Cada livro é uma obra do fichário; as edições e arquivos podem ser abertos aqui mesmo — a capa aparece quando você a adiciona na ficha.</p>
 <div class="filtros"><input id="q" placeholder="buscar autor ou obra…"><select id="f-genero"></select><select id="f-midia"></select><select id="f-tag"></select><span class="muted" id="total"></span></div>
 <div class="grade"><aside class="estante" id="estante"></aside><section id="livros"></section></div>
</main>
<script src="/static/base.js"></script><script src="/static/js/biblioteca.js"></script></html>
